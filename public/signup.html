<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sign up - Application Health Monitor</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="center-screen">
    <div class="card login-card">
      <h1>Create an account</h1>
      <p class="sub">Set your own username and password</p>
      <form id="signupForm">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required />
        <button class="btn-primary" type="submit">Create account</button>
        <div class="error-text" id="errorText"></div>
      </form>
      <p class="sub" style="margin-top:16px;">
        Already have an account? <a href="/login.html" style="color:var(--accent);">Sign in</a>
      </p>
    </div>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const errorText = document.getElementById('errorText');

    fetch('/api/session').then(r => r.json()).then(s => {
      if (s.loggedIn) window.location.href = '/index.html';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorText.textContent = '';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          errorText.textContent = data.error || 'Could not create account';
          return;
        }
        window.location.href = '/index.html';
      } catch (err) {
        errorText.textContent = 'Could not reach server';
      }
    });
  </script>
</body>
</html>
